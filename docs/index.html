<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商机跟踪</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font:15px system-ui,sans-serif}header{background:#112938;color:white;padding:28px max(5vw,20px)}h1{margin:0 0 6px;font-size:29px}p{line-height:1.6}main{max-width:1320px;margin:auto;padding:24px}nav,.stats,.board{display:flex;gap:12px;flex-wrap:wrap}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #c8d4df;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button.primary,button[aria-pressed=true]{background:#126658;color:white;border-color:#126658}.stats{margin:18px 0}.stat,.lane,article,dialog{background:white;border:1px solid #dce5ec;border-radius:12px;padding:16px}.stat{flex:1;min-width:135px}.stat strong{display:block;font-size:23px;margin-top:6px}.lane{flex:1;min-width:195px;background:#e9eff5}.lane h2{font-size:16px;margin:0 0 12px}.card{display:block;text-align:left;width:100%;margin-bottom:9px;background:white;padding:12px}.card small{display:block;margin-top:6px;color:#506579}.muted{color:#516679}article{margin-bottom:10px}dialog{max-width:min(680px,95vw);width:100%;max-height:90vh}dialog::backdrop{background:#12283799}label{display:grid;gap:5px;margin:8px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.row input,.row select{min-width:90px;flex:1;width:100px}h3{margin-bottom:5px}.warning{color:#9c420e}footer{margin:16px 0}
</style><header><h1>商机跟踪</h1><div>演示工作区 · 虚构数据</div></header><main><nav id="nav"></nav><section class="stats" id="stats"></section><p id="notice" class="muted"></p><section id="view"></section><footer><button id="export">导出备份</button> <label style="display:inline">导入备份 <input id="import" type="file" accept=".json"></label></footer></main><dialog id="editor"><form id="form"></form></dialog>
<script>
const stages=['线索','需求确认','报价','样品验证','定点或首单','量产'];
const currencies=['EUR','GBP','CNY','USD'];
const day=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const seed=[
{id:'A',customer:'样例客户 A',name:'动力线束',country:'西班牙',owner:'销售一组',stage:'报价',status:'待内部评审',currency:'EUR',notes:'客户已提供图纸，待确认样件交期。',start:'2027-03-01',end:'2028-12-31',fee:'0',forecasts:[['2027','120','35'],['2028','180','33']],actions:[['确认样件交期','研发',day(3),'待内部'],['核对最新图纸','销售',day(-1),'待客户']],milestones:[['首样',day(20)],['首批交付','2027-03-01']]},
{id:'B',customer:'样例客户 B',name:'机器人连接器',country:'英国',owner:'销售二组',stage:'需求确认',status:'待客户资料',currency:'GBP',notes:'客户关注完整线束方案。',start:'',end:'',fee:'',forecasts:[['2027','','']],actions:[['索取 BOM 和预计年用量','销售',day(5),'待客户']],milestones:[['需求评审',day(10)]]},
{id:'C',customer:'样例客户 C',name:'充电接口',country:'意大利',owner:'销售一组',stage:'样品验证',status:'待验证反馈',currency:'EUR',notes:'样品已寄出，等待验证。',start:'2027-04-01',end:'2027-12-31',fee:'300',forecasts:[['2027','500','12']],actions:[['收集验证反馈','销售',day(7),'待客户']],milestones:[['样品交付',day(-7)]]}];
const key='opportunity-tracker-demo-v1';let data=seed, page='商机看板';
try{data=JSON.parse(localStorage.getItem(key))||seed}catch{}
const $=id=>document.getElementById(id);
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c)=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:c}).format(v);
const total=p=>{
const year=Number(p.start.slice(0,4)),last=Number(p.end.slice(0,4));
if(!year||last<year||last-year+1!==p.forecasts.length)return null;
const years=new Set();let value=Number(p.fee||0);
for(const [y,q,price] of p.forecasts){if(!y||+y<year||+y>last||years.has(+y)||q===''||price==='')return null;years.add(+y);value+=Number(q)*Number(price)}
return Number.isFinite(value)?value:null;
};
const label=p=>total(p)===null?'金额待估算':money(total(p),p.currency);
const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));$('notice').textContent='编辑保存在当前浏览器。电脑重启会清空浏览器数据时，请先导出备份。'}catch{$('notice').textContent='浏览器存储不可用，请导出备份保存修改。'}};
function render(){
$('nav').innerHTML=['商机看板','本周跟进','项目时间线'].map(t=>'<button aria-pressed="'+(page===t)+'" data-page="'+t+'">'+t+'</button>').join('')+'<button class="primary" id="new">＋ 新建商机</button>';
const by={};for(const p of data){const n=total(p);if(n!==null)by[p.currency]=(by[p.currency]||0)+n}
const actions=data.flatMap(p=>p.actions.map(a=>[p,a])).filter(([,a])=>a[3]!=='完成'&&a[2]&&a[2]<=day(7)).sort((a,b)=>a[1][2].localeCompare(b[1][2]));
$('stats').innerHTML=[['商机数',data.length],['七天内及逾期待办',actions.length],['金额待估算',data.filter(p=>total(p)===null).length],...Object.entries(by).map(([c,n])=>['预计生命周期额 · '+c,money(n,c)])].map(([t,x])=>'<div class="stat">'+t+'<strong>'+x+'</strong></div>').join('');
const open=p=>'<button data-open="'+e(p.id)+'">查看或编辑</button>';
if(page==='商机看板')$('view').innerHTML='<div class="board">'+stages.map(s=>'<section class="lane"><h2>'+s+' · '+data.filter(p=>p.stage===s).length+'</h2>'+data.filter(p=>p.stage===s).map(p=>'<button class="card" data-open="'+e(p.id)+'"><strong>'+e(p.name)+'</strong><small>'+e(p.customer)+' · '+e(p.country)+'</small><small>'+e(p.status)+' · '+label(p)+'</small></button>').join('')+'</section>').join('')+'</div>';
if(page==='本周跟进')$('view').innerHTML=actions.map(([p,a])=>'<article><strong>'+e(a[0])+'</strong><p>'+e(p.name)+' · '+e(a[1])+' · <span class="'+(a[2]<day()?'warning':'')+'">'+e(a[2])+(a[2]<day()?' 逾期':'')+'</span> · '+e(a[3])+'</p>'+open(p)+'</article>').join('')||'<p>未来七天没有到期行动。</p>';
if(page==='项目时间线')$('view').innerHTML=data.flatMap(p=>p.milestones.map(m=>[p,m])).sort((a,b)=>a[1][1].localeCompare(b[1][1])).map(([p,m])=>'<article><strong>'+e(m[1]||'日期待确认')+' · '+e(m[0])+'</strong><p>'+e(p.customer)+' · '+e(p.name)+'</p>'+open(p)+'</article>').join('')||'<p>还没有里程碑。</p>';
}
const input=(n,v,type='text',extra='')=>'<input name="'+n+'" type="'+type+'" value="'+e(v)+'" '+extra+'>';
const select=(n,v,options)=>'<select name="'+n+'">'+options.map(x=>'<option '+(x===v?'selected':'')+'>'+e(x)+'</option>').join('')+'</select>';
const field=(t,s)=>'<label>'+t+s+'</label>';
const kinds={actions:['行动','负责人','截止日','状态'],forecasts:['年度','预计供货量','预计单价'],milestones:['节点','计划日期']};
function row(kind,values=[]){return '<div class="row">'+kinds[kind].map((t,i)=>kind==='actions'&&i===3?select(t,values[i],['待内部','待客户','完成']):input(t,values[i],kind==='forecasts'?'number':t==='截止日'||t==='计划日期'?'date':'text','aria-label="'+t+'" placeholder="'+t+'" '+(kind==='forecasts'?'min="0" step="'+(i===2?'0.01':'1')+'"':''))).join('')+'<button type="button" data-remove aria-label="移除此行">×</button></div>'}
function edit(id){
const p=data.find(x=>x.id===id)||{id:crypto.randomUUID(),stage:stages[0],currency:'EUR',actions:[],forecasts:[],milestones:[]};
$('form').dataset.id=p.id;$('form').innerHTML='<h2>商机详情</h2><div class="fields">'+[['客户','customer'],['项目','name'],['国家','country'],['负责人','owner'],['推进状态','status'],['量产开始','start','date'],['预计供货结束','end','date'],['一次性费用','fee','number']].map(([t,n,type])=>field(t,input(n,p[n],type,n==='name'||n==='customer'?'required':n==='fee'?'min="0" step="0.01"':''))).join('')+field('阶段',select('stage',p.stage,stages))+field('币种',select('currency',p.currency,currencies))+'</div>'+field('最近进展与待确认事项','<textarea name="notes">'+e(p.notes)+'</textarea>')+Object.keys(kinds).map((k,i)=>'<h3>'+['行动项','年度预测','项目里程碑'][i]+'</h3><div id="'+k+'">'+p[k].map(v=>row(k,v)).join('')+'</div><button type="button" data-add="'+k+'">＋ 添加</button>').join('')+'<p><button class="primary">保存修改</button> <button type="button" id="cancel">取消</button></p>';$('editor').showModal();
}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){page=d.page;render()}if(d.open)edit(d.open);if(b.id==='new')edit();if(b.id==='cancel')$('editor').close();if(d.add)$(d.add).insertAdjacentHTML('beforeend',row(d.add));if('remove'in d)b.closest('.row').remove()});
$('form').onsubmit=ev=>{ev.preventDefault();const p=Object.fromEntries(new FormData(ev.target));for(const names of Object.values(kinds))for(const n of names)delete p[n];p.id=ev.target.dataset.id;for(const k of Object.keys(kinds))p[k]=Array.from($(k).children,r=>Array.from(r.querySelectorAll('input,select'),c=>c.value)).filter(v=>v[0]||v[1]);const i=data.findIndex(x=>x.id===p.id);if(i<0)data.push(p);else data[i]=p;save();render();$('editor').close()};
$('export').onclick=()=>{const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));link.download='商机备份.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};
$('import').onchange=async ev=>{try{const next=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(next)||!next.every(p=>p&&['id','customer','name','start','end'].every(k=>typeof p[k]==='string')&&stages.includes(p.stage)&&currencies.includes(p.currency)&&Object.keys(kinds).every(k=>Array.isArray(p[k])&&p[k].every(r=>Array.isArray(r)&&r.length===kinds[k].length&&r.every(x=>typeof x==='string')))))throw Error();if(confirm('用备份替换当前工作区？')){data=next;save();render()}}catch{alert('请选择本网站导出的有效备份文件。')}ev.target.value=''};
save();render();
</script></html>
