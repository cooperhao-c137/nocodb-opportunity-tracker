services:
  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NC_SITE_URL: http://localhost:8080
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
volumes:
  nocodb_data:
